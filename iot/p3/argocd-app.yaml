apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-project
  # This must be deployed in the same namespace where Argo CD is installed
  namespace: argocd
spec:
  project: default

  # 1. SOURCE (Your GitHub Repository)
  source:
    repoURL: 'https://github.com/yourusername/iot-project.git' # <-- Change this to your repo!
    targetRevision: main                                       # <-- Change to 'master' if needed
    path: .                                                    # <-- Change if your YAMLs are in a specific folder

  # 2. DESTINATION (Your K3d Cluster)
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default

  # 3. SYNC POLICY (The Automation)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true