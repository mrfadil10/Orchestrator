apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-argocd-development
spec:
  project: development
  source:
    repoURL: 'https://github.com/mrfadil10/mfadil_config.git'
    targetRevision: main
    path: .
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
