apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bonus-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'http://gitlab.k3d.local/root/iot-bonus.git'
    targetRevision: main
    path: dev  # <--- THIS IS CRITICAL
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true